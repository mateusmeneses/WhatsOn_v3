name: whatson2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-whatson}
      POSTGRES_PASSWORD: ${DB_PASS:-whatson}
      POSTGRES_DB: ${DB_NAME:-whatson}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-whatson} -d ${DB_NAME:-whatson}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_BIND:-127.0.0.1:6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    restart: unless-stopped
    ports:
      - "${EVOLUTION_BIND:-127.0.0.1:8080}:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-whatson}:${DB_PASS:-whatson}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: whatson2
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_URL: http://evolution:8080
      BACKEND_PUBLIC_URL: http://backend:4000
      MEDIA_DIR: /app/public/media
    ports:
      - "${BACKEND_BIND:-4000}:4000"
    volumes:
      - media_data:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  media_data:
